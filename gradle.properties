org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.nonFinalResIds=false
org.gradle.parallel=true
org.gradle.caching=true
kotlin.incremental=true

# ─── R8 : mode compat au lieu du mode complet ──────────────────────────────
# `minifyReleaseWithR8` echouait systematiquement en
# java.util.ConcurrentModificationException — un bug interne de R8, pas une
# erreur du code : la compilation Kotlin passe entierement, c'est l'etape de
# minification qui plante sur elle-meme. Aucun APK release ne pouvait sortir.
#
# Le mode complet (defaut depuis AGP 8.0) applique des optimisations
# supplementaires ; c'est la ou se declenche le bug. Le mode compat suit le
# comportement historique de ProGuard.
#
# Ce qui est conserve : l'obfuscation des noms, la suppression du code mort,
# le shrinking des ressources. On ne perd que quelques optimisations
# additionnelles — aucun impact sur la securite ni sur le comportement.
#
# A retenter en mode complet apres une montee d'AGP (8.7+), ou l'on saura si
# le bug est corrige en amont.
android.enableR8.fullMode=false
