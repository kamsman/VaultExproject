# ==========================================================================
# Configuration de déploiement du relais de cours
# ==========================================================================
#
# Ce fichier manquait, et son absence ne se voyait pas : le worker avait été
# créé depuis le tableau de bord Cloudflare, où l'on colle le code à la main.
# `wrangler deploy` échouait donc avec un message trompeur — « aucun dossier
# de fichiers statiques » — parce que, faute de configuration, Wrangler
# suppose qu'on déploie un site web.
#
# --------------------------------------------------------------------------
# DÉPLOYER
# --------------------------------------------------------------------------
#
#   cd tools/relais-cours
#   npx wrangler deploy --config wrangler.toml
#
# Sous PowerShell, si `npx` est bloqué par la politique d'exécution, appeler
# `npx.cmd` : il contourne le script .ps1 sans rien changer aux réglages de
# sécurité de la machine.
#
# --------------------------------------------------------------------------
# POURQUOI `--config`, ALORS QUE LE FICHIER EST DANS LE DOSSIER COURANT
# --------------------------------------------------------------------------
#
# MESURÉ : `npx wrangler deploy` depuis ce dossier a lu `../../wrangler.jsonc`
# — un fichier de la RACINE DU DÉPÔT — et a échoué sur « Expected "name" to
# be ... but got "VaultEx" ».
#
# Ce fichier-là n'est pas versionné : il est apparu tout seul sur la machine,
# et son `name` est simplement le nom du dossier du projet Android. Wrangler
# remonte l'arborescence à la recherche d'une configuration et préfère le
# format JSON ; il trouve donc celle de la racine avant celle-ci.
#
# L'effet est le pire possible : un déploiement qui ÉCHOUE est bruyant et se
# corrige, mais la même recherche pourrait un jour aboutir — et publier le
# relais sous un autre nom, à une autre adresse, pendant que l'application
# continue d'appeler l'ancienne. C'est exactement le mode de panne qu'on
# vient de passer une séance entière à diagnostiquer.
#
# `--config wrangler.toml` supprime la recherche : on nomme le fichier.
#
# La première fois, une page de connexion Cloudflare s'ouvre dans le
# navigateur. C'est une fois pour toutes sur cette machine.
#
# --------------------------------------------------------------------------
# VÉRIFIER APRÈS COUP — ET NE PAS SAUTER CETTE ÉTAPE
# --------------------------------------------------------------------------
#
#   https://vaultex-prix.<compte>.workers.dev/sante
#
# La réponse porte le numéro de VERSION défini en tête de worker.js. C'est le
# seul moyen de savoir si le code déployé est bien le dernier : on a déjà
# perdu du temps à corriger un défaut qui l'était déjà, simplement parce que
# l'ancienne version tournait encore.
#
# --------------------------------------------------------------------------
# LE NOM DOIT CORRESPONDRE À CELUI DU TABLEAU DE BORD
# --------------------------------------------------------------------------
#
# Sinon Wrangler crée un SECOND worker, à une autre adresse, et l'application
# continue d'appeler l'ancien — sans aucune erreur nulle part. Le nom ci-
# dessous est celui déduit de l'URL configurée dans local.properties
# (prix.relay.url) ; s'il diffère du tableau de bord, corriger ICI et non là-
# bas, l'URL étant déjà distribuée dans des APK installés.
# ==========================================================================

name = "vaultex-prix"
main = "worker.js"

# ==========================================================================
# NE PAS EFFACER LES VARIABLES DU TABLEAU DE BORD
# ==========================================================================
#
# Sans cette ligne, `wrangler deploy` considère que ce fichier est la vérité
# sur les variables du Worker. Comme il n'en déclare aucune, il SUPPRIME
# celles qui sont réglées dans le tableau de bord.
#
# Ça s'est produit : un déploiement a proposé d'effacer CHANGE_MIN, et il
# aurait emporté le reste. Les conséquences ne se voient pas tout de suite —
# le Worker répond, les prix s'affichent — mais CHANGE_ADRESSES disparu, les
# ventes se ferment ; CHANGE_NUMERO disparu, l'écran d'achat n'a plus
# personne à payer. On chercherait du côté du code, qui n'aurait pas bougé.
#
# TOUS LES RÉGLAGES DU CHANGE VIVENT DANS LE TABLEAU DE BORD, et c'est
# délibéré : la marge suit le marché, le plafond suit la confiance, et
# CHANGE_ACTIF ferme le service en une seconde — sans republier quoi que ce
# soit. Les mettre ici, dans un fichier versionné, rendrait chaque
# ajustement dépendant d'un déploiement.
#
# Un secret (TG_CHANGE_TOKEN, CHANGE_SMS_TOKEN) n'est jamais touché par un
# déploiement, avec ou sans cette ligne. Elle ne concerne que les variables
# en clair.
#
# Si une version de Wrangler refusait cette clé, l'équivalent en ligne de
# commande est `--keep-vars`.
#
# --------------------------------------------------------------------------
# L'AVERTISSEMENT QUI FAIT PEUR, ET QU'IL FAUT ACCEPTER
# --------------------------------------------------------------------------
#
# À chaque déploiement, Wrangler affiche la liste des variables du tableau
# de bord précédées d'un SIGNE MOINS, puis demande :
#
#     Uploading the Worker will override the remote configuration
#     with your local one.
#     Would you like to continue? ...
#
# Il faut répondre OUI.
#
# Ce diff décrit ce qui arriverait SANS `keep_vars` — c'est la comparaison
# entre ce fichier, qui ne déclare aucune variable, et le tableau de bord
# qui en porte huit. `keep_vars` agit ensuite, au moment de l'envoi.
#
# VÉRIFIÉ APRÈS COUP, ET PAS DÉDUIT : après un déploiement où toutes les
# variables apparaissaient en moins et où l'on a répondu oui,
# /change/parametres rendait encore la marge, le plafond, les deux adresses,
# les minimums par monnaie et le modèle USSD. Rien n'avait bougé.
#
# C'est écrit ici parce que la prudence pousse à répondre « no » — ce qui
# annule le déploiement et laisse l'ancienne version en service, sans que
# rien ne le signale. On a déjà perdu une séance entière à chercher pourquoi
# quatre versions n'étaient jamais arrivées en ligne.
#
# En cas de doute, la réponse est à une adresse, pas à une supposition :
#
#     https://vaultex-prix.<compte>.workers.dev/change/parametres
# ==========================================================================
keep_vars = true

# Fige le comportement de la plateforme à une date connue : une mise à jour
# de Cloudflare ne peut donc pas changer le fonctionnement du relais sans
# qu'on l'ait décidé en modifiant cette ligne.
compatibility_date = "2025-09-26"

# ==========================================================================
# LA MÉMOIRE DURABLE — ESPACE KV « MEMOIRE »
# ==========================================================================
#
# Tout ce que le relais doit se rappeler y vit : la naissance de chaque
# demande (pour l'antériorité), les transferts déjà servis (pour qu'un
# versement ne paie qu'une fois), les paiements Orange Money lus par SMS,
# et les limites de débit.
#
# Avant, c'était `caches.default`. Diagnostiqué sur une vraie vente : la
# naissance écrite par /change/consigne était introuvable par
# /change/verifier. Le cache de Cloudflare est PAR CENTRE DE DONNÉES,
# évinçable à tout moment, et échoue en silence — donc deux barrières de
# sécurité se désactivaient toutes seules sans que rien ne le signale.
#
# --------------------------------------------------------------------------
# LE CRÉER — DEPUIS LE TABLEAU DE BORD
# --------------------------------------------------------------------------
#
# Il EXISTE DÉJÀ, et il est déclaré plus bas — il n'y a rien à faire. Ce qui
# suit ne sert qu'à le recréer sur un autre compte.
#
#   1. Storage & Databases → KV → Create namespace
#      Nom : MEMOIRE
#
#   2. Relever son identifiant et le reporter dans [[kv_namespaces]] ci-dessous :
#      npx wrangler kv namespace list --config wrangler.toml
#
#   3. Déployer, puis :
#      node ../../tools/relais-cours/verifier-deploiement.mjs
#      Il doit dire « memoire : KV (durable) ».
#
# --------------------------------------------------------------------------
# POURQUOI ELLE EST DÉCLARÉE ICI, ET PLUS SEULEMENT DANS LE TABLEAU DE BORD
# --------------------------------------------------------------------------
#
# MESURÉ, À LA PREMIÈRE VRAIE UTILISATION DE WRANGLER. Le déploiement a
# réussi — version 48 en ligne — et il a EMPORTÉ la liaison KV. La sonde est
# passée de « KV (durable) » à « cache (FRAGILE) » dans la même minute.
#
# `keep_vars = true` protège les VARIABLES en clair du tableau de bord. Il ne
# protège pas les LIAISONS : pour celles-là, ce fichier fait foi, et ce qu'il
# ne déclare pas est retiré.
#
# Ces lignes étaient commentées, avec la consigne de les laisser ainsi tant
# qu'on déployait en collant le code à la main. C'était juste à l'époque, et
# faux dès le premier `wrangler deploy` — une note qui dit « ne pas toucher »
# sans dire « jusqu'à quand » finit toujours par être lue trop tard.
#
# CE QUE ÇA COÛTAIT, ET POURQUOI C'EST GRAVE. Sans KV, le relais retombe sur
# `caches.default` : par centre de données, évinçable, et silencieux. Deux
# barrières s'éteignent alors toutes seules — l'antériorité des demandes, et
# « un versement ne paie qu'une fois » — sans qu'aucun écran ne change. On
# ne l'apprendrait qu'en perdant de l'argent.
#
# `verifier-deploiement.mjs` contrôle cette ligne à chaque passage, et c'est
# lui qui l'a vue. Le déclarer ici ferme la cause ; le script reste là pour
# le jour où quelque chose d'autre l'emportera.

[[kv_namespaces]]
binding = "MEMOIRE"
id = "a10b5ca2d5e34bd1aaeb81d7b9b6784b"

# --------------------------------------------------------------------------
# CE QUE KV NE RÈGLE PAS
# --------------------------------------------------------------------------
#
# Il est à cohérence éventuelle, donc PAS atomique. Deux requêtes vraiment
# simultanées peuvent lire la même valeur avant que l'une n'écrive : pour
# « un transfert ne paie qu'une fois », ça laisse une fenêtre de quelques
# secondes. La fermer demande un Durable Object — un autre modèle de
# déploiement. C'est écrit ici pour que personne ne croie le sujet clos.
# ==========================================================================
