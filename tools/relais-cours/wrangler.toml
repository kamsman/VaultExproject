# ==========================================================================
# Configuration de déploiement du relais de cours
# ==========================================================================
#
# Ce fichier manquait, et son absence ne se voyait pas : le worker avait été
# créé depuis le tableau de bord Cloudflare, où l'on colle le code à la main.
# `wrangler deploy` échouait donc avec un message trompeur — « aucun dossier
# de fichiers statiques » — parce que, faute de configuration, Wrangler
# suppose qu'on déploie un site web.
#
# --------------------------------------------------------------------------
# DÉPLOYER
# --------------------------------------------------------------------------
#
#   cd tools/relais-cours
#   npx wrangler deploy
#
# Sous PowerShell, si `npx` est bloqué par la politique d'exécution, appeler
# `npx.cmd` : il contourne le script .ps1 sans rien changer aux réglages de
# sécurité de la machine.
#
# La première fois, une page de connexion Cloudflare s'ouvre dans le
# navigateur. C'est une fois pour toutes sur cette machine.
#
# --------------------------------------------------------------------------
# VÉRIFIER APRÈS COUP — ET NE PAS SAUTER CETTE ÉTAPE
# --------------------------------------------------------------------------
#
#   https://vaultex-prix.<compte>.workers.dev/sante
#
# La réponse porte le numéro de VERSION défini en tête de worker.js. C'est le
# seul moyen de savoir si le code déployé est bien le dernier : on a déjà
# perdu du temps à corriger un défaut qui l'était déjà, simplement parce que
# l'ancienne version tournait encore.
#
# --------------------------------------------------------------------------
# LE NOM DOIT CORRESPONDRE À CELUI DU TABLEAU DE BORD
# --------------------------------------------------------------------------
#
# Sinon Wrangler crée un SECOND worker, à une autre adresse, et l'application
# continue d'appeler l'ancien — sans aucune erreur nulle part. Le nom ci-
# dessous est celui déduit de l'URL configurée dans local.properties
# (prix.relay.url) ; s'il diffère du tableau de bord, corriger ICI et non là-
# bas, l'URL étant déjà distribuée dans des APK installés.
# ==========================================================================

name = "vaultex-prix"
main = "worker.js"

# ==========================================================================
# NE PAS EFFACER LES VARIABLES DU TABLEAU DE BORD
# ==========================================================================
#
# Sans cette ligne, `wrangler deploy` considère que ce fichier est la vérité
# sur les variables du Worker. Comme il n'en déclare aucune, il SUPPRIME
# celles qui sont réglées dans le tableau de bord.
#
# Ça s'est produit : un déploiement a proposé d'effacer CHANGE_MIN, et il
# aurait emporté le reste. Les conséquences ne se voient pas tout de suite —
# le Worker répond, les prix s'affichent — mais CHANGE_ADRESSES disparu, les
# ventes se ferment ; CHANGE_NUMERO disparu, l'écran d'achat n'a plus
# personne à payer. On chercherait du côté du code, qui n'aurait pas bougé.
#
# TOUS LES RÉGLAGES DU CHANGE VIVENT DANS LE TABLEAU DE BORD, et c'est
# délibéré : la marge suit le marché, le plafond suit la confiance, et
# CHANGE_ACTIF ferme le service en une seconde — sans republier quoi que ce
# soit. Les mettre ici, dans un fichier versionné, rendrait chaque
# ajustement dépendant d'un déploiement.
#
# Un secret (TG_CHANGE_TOKEN, CHANGE_SMS_TOKEN) n'est jamais touché par un
# déploiement, avec ou sans cette ligne. Elle ne concerne que les variables
# en clair.
#
# Si une version de Wrangler refusait cette clé, l'équivalent en ligne de
# commande est `--keep-vars`.
# ==========================================================================
keep_vars = true

# Fige le comportement de la plateforme à une date connue : une mise à jour
# de Cloudflare ne peut donc pas changer le fonctionnement du relais sans
# qu'on l'ait décidé en modifiant cette ligne.
compatibility_date = "2025-09-26"

# ==========================================================================
# LA MÉMOIRE DURABLE — ESPACE KV « MEMOIRE »
# ==========================================================================
#
# Tout ce que le relais doit se rappeler y vit : la naissance de chaque
# demande (pour l'antériorité), les transferts déjà servis (pour qu'un
# versement ne paie qu'une fois), les paiements Orange Money lus par SMS,
# et les limites de débit.
#
# Avant, c'était `caches.default`. Diagnostiqué sur une vraie vente : la
# naissance écrite par /change/consigne était introuvable par
# /change/verifier. Le cache de Cloudflare est PAR CENTRE DE DONNÉES,
# évinçable à tout moment, et échoue en silence — donc deux barrières de
# sécurité se désactivaient toutes seules sans que rien ne le signale.
#
# --------------------------------------------------------------------------
# LE CRÉER — DEPUIS LE TABLEAU DE BORD
# --------------------------------------------------------------------------
#
#   1. Storage & Databases → KV → Create namespace
#      Nom : vaultex-memoire
#
#   2. Workers & Pages → vaultex-prix → Settings → Bindings → Add → KV
#      Variable name : MEMOIRE          ← ce nom exactement
#      KV namespace  : vaultex-memoire
#
#   3. Deploy, puis ouvrir /sante : il doit dire « memoire: KV (durable) ».
#      S'il dit « cache (FRAGILE) », la liaison n'est pas prise.
#
# --------------------------------------------------------------------------
# SI UN JOUR ON DÉPLOIE AVEC WRANGLER
# --------------------------------------------------------------------------
#
# Décommenter ci-dessous et coller l'identifiant affiché par le tableau de
# bord. Tant que le déploiement se fait en collant le code dans « Edit
# code », ces lignes doivent RESTER COMMENTÉES : un identifiant absent ou
# faux ferait échouer `wrangler deploy`, et une liaison déclarée ici mais
# vide écraserait celle du tableau de bord.
#
# [[kv_namespaces]]
# binding = "MEMOIRE"
# id = "<identifiant affiche par le tableau de bord>"
#
# --------------------------------------------------------------------------
# CE QUE KV NE RÈGLE PAS
# --------------------------------------------------------------------------
#
# Il est à cohérence éventuelle, donc PAS atomique. Deux requêtes vraiment
# simultanées peuvent lire la même valeur avant que l'une n'écrive : pour
# « un transfert ne paie qu'une fois », ça laisse une fenêtre de quelques
# secondes. La fermer demande un Durable Object — un autre modèle de
# déploiement. C'est écrit ici pour que personne ne croie le sujet clos.
# ==========================================================================
